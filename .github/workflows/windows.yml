# 윈도우 설치 파일(.exe) 빌드 → GitHub Releases "windows-latest"에 올림
name: Windows 빌드

on:
  push:
    branches: [main]
    # 버전 태그(v1.1.0)가 올라오면 그 릴리스에 설치 파일을 붙인다 → 앱이 업데이트로 받는다
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 의존성 설치
        run: npm ci

      # 맥 개발 환경용 빌드 폴더 설정(.cargo/config.toml)은 윈도우 서버에서 쓰지 않음
      - name: 맥 전용 설정 제거
        shell: pwsh
        run: Remove-Item -Force src-tauri/.cargo/config.toml -ErrorAction SilentlyContinue

      - name: yt-dlp·ffmpeg·deno 준비
        shell: pwsh
        run: ./scripts/prepare-tools-win.ps1

      # 빌드 서버 IP는 유튜브가 막을 수 있어서 실패해도 빌드는 계속함
      - name: 도구 동작 확인 (4K 검색·다운로드)
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: ./scripts/smoke-test-win.ps1

      # 실패하면 로그 마지막 부분을 오류 요약(annotation)으로 남김 → 로그인 없이도 원인 확인 가능
      - name: 앱 빌드
        shell: pwsh
        run: |
          npx tauri build 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log -Tail 40 | Where-Object { $_.Trim() } | ForEach-Object { "::error::$_" }
            exit 1
          }

      - name: 설치 파일 이름 정리
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          Copy-Item $exe.FullName IdolMV4K-windows-setup.exe
          "도구 확인 결과: ${{ steps.smoke.outcome }}" | Out-File -Encoding utf8 release-notes.md

      # main 브랜치 빌드는 "windows-latest" 미리 보기로, 버전 태그는 그 버전 릴리스로 올린다.
      # 앱의 업데이트 확인은 정식 릴리스(releases/latest)만 보므로 미리 보기는 걸리지 않는다.
      - name: Releases에 올리기 (미리 보기)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: 윈도우 최신 빌드
          prerelease: true
          body_path: release-notes.md
          files: IdolMV4K-windows-setup.exe

      # 파일 이름의 끝부분으로 앱이 자기 것을 고른다 (src-tauri/src/update.rs의 asset_suffix)
      - name: 버전 릴리스에 올리기
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Copy-Item IdolMV4K-windows-setup.exe "IdolMV4K-$v-windows-setup.exe"
      - name: 버전 릴리스 업로드
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: IdolMV4K-*-windows-setup.exe
